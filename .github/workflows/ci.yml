name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run

      # The production build is what deploys. Tests and tsc passed while `next build`
      # failed (non-async exports in "use server" files), so CI must build too.
      - name: Build
        run: npm run build
        env:
          # Throwaway value: satisfies the production guard during the build only.
          JWT_SECRET: ci-build-only-not-a-real-secret
